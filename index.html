<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monte um Átomo - TCC Química</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="icon" href="arly.png">
<style>
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: #888; border-radius: 10px; }
  .orbita { animation: gira linear infinite; transform-origin: 200px 200px; }
  @keyframes gira { to { transform: rotate(360deg); } }
  .el { transition: transform .15s; }
  .el:hover:not(:disabled) { transform: scale(1.2); }
  /* elemento em destaque durante o tutorial fica acima do blur */
  .foco { position: relative; z-index: 50; box-shadow: 0 0 0 4px #a855f7, 0 0 0 9999px transparent; border-radius: 1rem; background: #fff; }
  .flutua { animation: flutua 3s ease-in-out infinite; }
  @keyframes flutua { 50% { transform: translateY(-6px); } }
  @media (prefers-reduced-motion: reduce) { .orbita, .flutua { animation: none; } }
</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-purple-50 via-white to-blue-50 text-gray-800">

<div class="max-w-6xl mx-auto p-4 grid gap-4 lg:grid-cols-[1fr_24rem]">

  <!-- Área do átomo -->
  <section class="bg-white/95 rounded-2xl shadow-2xl border border-gray-200 p-4">
    <header class="flex flex-wrap items-center gap-3 mb-3">
      <img src="arly.png" alt="Arly" class="w-12 h-12 shrink-0 rounded-full bg-gradient-to-br from-purple-600 to-blue-600 p-0.5 object-contain">
      <div>
        <h1 class="text-xl font-bold">Monte um Átomo</h1>
        <p class="text-xs text-gray-500">Dados da PubChem · Prótons, nêutrons e elétrons</p>
      </div>
      <div class="ml-auto flex items-center gap-2">
        <button id="abrirTutorial" class="text-xs px-3 py-1.5 rounded-full border border-purple-300 text-purple-700 hover:bg-purple-50">Tutorial</button>
        <div id="modos" class="flex gap-1 bg-gray-100 rounded-full p-1 text-sm">
          <button data-modo="livre" class="modo px-3 py-1.5 rounded-full">Livre</button>
          <button data-modo="desafio" class="modo px-3 py-1.5 rounded-full">Desafio</button>
        </div>
      </div>
    </header>

    <div id="desafio" class="hidden mb-3 p-3 bg-gradient-to-r from-purple-50 to-blue-50 rounded-xl border border-purple-200 text-sm flex flex-wrap items-center gap-2">
      <span class="font-semibold text-purple-700">Monte:</span>
      <span id="alvo" class="font-bold text-base"></span>
      <span class="ml-auto text-gray-600">Rodada <b id="rodada"></b>/10 · Pontos <b id="pontos">0</b></span>
      <button id="verificar" class="bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-700 hover:to-blue-700 text-white px-4 py-1.5 rounded-xl shadow-md">Verificar</button>
    </div>

    <svg id="atomo" viewBox="0 0 400 400" class="w-full max-w-md mx-auto block" role="img" aria-label="Desenho do átomo"></svg>

    <div id="contadores" class="grid grid-cols-3 gap-2 mt-3">
      <div class="contador" data-p="p"></div>
      <div class="contador" data-p="n"></div>
      <div class="contador" data-p="e"></div>
    </div>
    <button id="limpar" class="mt-3 text-xs px-3 py-1.5 bg-gray-200 rounded hover:bg-gray-300 transition">Limpar átomo</button>
  </section>

  <!-- Painel de informações -->
  <aside class="bg-white/95 rounded-2xl shadow-2xl border border-gray-200 p-5 space-y-4">
    <div id="status" class="p-3 bg-gray-100 rounded-xl text-sm text-gray-600">Carregando elementos da PubChem...</div>

    <div id="info" class="flex gap-4 items-center p-2">
      <div id="cartao" class="w-24 h-28 shrink-0 rounded-xl border-2 border-purple-300 flex flex-col items-center justify-center bg-gradient-to-br from-purple-50 to-blue-50"></div>
      <dl class="text-sm space-y-1 flex-1">
        <div class="flex justify-between gap-2"><dt class="text-gray-500">Elemento</dt><dd id="iNome" class="font-semibold text-right">-</dd></div>
        <div class="flex justify-between"><dt class="text-gray-500">Nº de massa (A)</dt><dd id="iMassa" class="font-semibold">-</dd></div>
        <div class="flex justify-between"><dt class="text-gray-500">Carga</dt><dd id="iCarga" class="font-semibold">-</dd></div>
        <div class="flex justify-between"><dt class="text-gray-500">Tipo</dt><dd id="iTipo" class="font-semibold">-</dd></div>
        <div class="flex justify-between"><dt class="text-gray-500">Núcleo</dt><dd id="iEstavel" class="font-semibold">-</dd></div>
      </dl>
    </div>

    <div id="tabelaBox" class="p-2">
      <div class="text-xs font-semibold text-gray-600 mb-2">Tabela periódica <span class="font-normal text-gray-400">· clique para montar o elemento</span></div>
      <div id="tabela" class="grid gap-[2px]" style="grid-template-columns: repeat(18, minmax(0, 1fr));"></div>
    </div>
  </aside>
</div>

<!-- Tutorial: o blur bloqueia tudo, menos o elemento em foco -->
<div id="tutBlur" class="hidden fixed inset-0 z-40 bg-purple-950/30 backdrop-blur-sm"></div>
<div id="tutCard" class="hidden fixed z-50 inset-x-4 sm:inset-x-auto sm:left-6 max-w-md flex items-end gap-3" role="dialog" aria-live="polite">
  <img src="arly.png" alt="Arly, a professora guia" class="w-28 sm:w-36 shrink-0 flutua drop-shadow-xl">
  <div class="bg-white rounded-2xl shadow-2xl border border-purple-200 p-4 mb-4">
    <div class="text-xs font-semibold text-purple-700 mb-1">Arly <span id="tutPasso" class="font-normal text-gray-400"></span></div>
    <p id="tutTexto" class="text-sm text-gray-700"></p>
    <div class="flex justify-between items-center mt-3">
      <button id="tutPular" class="text-xs text-gray-400 hover:text-gray-600">Pular tutorial</button>
      <button id="tutProximo" class="bg-gradient-to-r from-purple-600 to-blue-600 text-white text-sm px-4 py-1.5 rounded-xl shadow-md">Próximo</button>
    </div>
  </div>
</div>

<script src="jogo.js"></script>
</body>
</html>
